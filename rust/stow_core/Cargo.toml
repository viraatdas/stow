[package]
name = "stow_core"
version = "0.5.1"
edition = "2021"
publish = false

[lib]
name = "stow_core"
# staticlib  -> the .a we link into the app + extension + CLI
# rlib       -> lets `cargo test` build the internal logic tests
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "2"
dirs = "5"
blake3 = "1"

# Async runtime + AWS S3 + local index
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-credential-types = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
# Folder shares are uploaded as a single zip (one-click download for recipients).
zip = { version = "2", default-features = false, features = ["deflate"] }
