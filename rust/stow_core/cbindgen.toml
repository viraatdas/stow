language = "C"
header = "// Generated by cbindgen from rust/stow_core. Do not edit by hand."
include_guard = "STOW_CORE_H"
pragma_once = true
tab_width = 4
documentation = true
documentation_style = "c99"
style = "type"

[export]
prefix = ""
# Force the status enum into the header even though no signature references it
# (functions return a plain int); Swift uses the named constants.
include = ["StowStatus"]

[parse]
parse_deps = false

[enum]
prefix_with_name = true
