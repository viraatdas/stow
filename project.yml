name: Stow
options:
  bundleIdPrefix: ai.exla
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "3C4383262W"   # Viraat Das (paid program)
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64                     # Apple Silicon only; Rust xcframework is arm64
    ONLY_ACTIVE_ARCH: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ---- Faceless background agent (hosts the extension) -------------------
  StowAgent:
    type: application
    platform: macOS
    sources:
      - path: apps/StowAgent/Sources
      - path: packages/StowCore/Sources/StowCore
    info:
      path: apps/StowAgent/Info.plist
      properties:
        CFBundleName: Stow
        CFBundleDisplayName: Stow
        LSUIElement: true            # faceless: no Dock icon, no menu bar
        LSMinimumSystemVersion: "14.0"
    entitlements:
      path: apps/StowAgent/StowAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.ai.exla.stow
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.exla.stow
    dependencies:
      - target: StowFileProvider
        embed: true
      - framework: artifacts/StowCore.xcframework
        embed: false
    preBuildScripts:
      - script: "\"$PROJECT_DIR/scripts/build-rust-xcframework.sh\""
        name: Build Rust core (xcframework)
        basedOnDependencyAnalysis: false

  # ---- File Provider extension -------------------------------------------
  StowFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: apps/StowFileProvider/Sources
      - path: packages/StowCore/Sources/StowCore
    info:
      path: apps/StowFileProvider/Info.plist
      properties:
        CFBundleDisplayName: Stow File Provider
        # All File Provider keys MUST live INSIDE the NSExtension dict —
        # NSExtensionFileProviderDocumentGroup at the Info.plist root is a
        # documented cause of NSFileProviderManager.add failing with -2014.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderDocumentGroup: group.ai.exla.stow
          NSExtensionFileProviderSupportsEnumeration: true
    entitlements:
      path: apps/StowFileProvider/StowFileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.ai.exla.stow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.exla.stow.fileprovider
    dependencies:
      - framework: artifacts/StowCore.xcframework
        embed: false
    preBuildScripts:
      - script: "\"$PROJECT_DIR/scripts/build-rust-xcframework.sh\""
        name: Build Rust core (xcframework)
        basedOnDependencyAnalysis: false

  # ---- stow CLI ----------------------------------------------------------
  stow:
    type: tool
    platform: macOS
    sources:
      - path: cli/stow/Sources
      - path: packages/StowCore/Sources/StowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.exla.stow.cli
        PRODUCT_NAME: stow
    dependencies:
      - framework: artifacts/StowCore.xcframework
        embed: false
    preBuildScripts:
      - script: "\"$PROJECT_DIR/scripts/build-rust-xcframework.sh\""
        name: Build Rust core (xcframework)
        basedOnDependencyAnalysis: false

schemes:
  StowAgent:
    build:
      targets:
        StowAgent: all
    run:
      config: Debug
  stow:
    build:
      targets:
        stow: all
    run:
      config: Debug
